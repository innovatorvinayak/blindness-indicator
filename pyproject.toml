[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drscreen"
version = "2.0.0"
description = "AI-assisted Diabetic Retinopathy screening: ResNet-152 severity grading, patient records and SMS reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pillow>=10.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    # For the GUI's scrollable views: a mature, widely-deployed Tkinter
    # extension whose mousewheel/trackpad handling has been battle-tested
    # across real macOS/Windows/Linux use, rather than a from-scratch one.
    "customtkinter>=5.2",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
sms = ["twilio>=9.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["drscreen[mysql,sms,dev]"]

[project.scripts]
drscreen = "drscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:torchvision.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
