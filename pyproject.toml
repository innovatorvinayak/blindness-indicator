[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drscreen"
version = "2.0.0"
description = "AI-assisted Diabetic Retinopathy screening: ResNet-152 severity grading, patient records and SMS reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pillow>=10.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # required by FastAPI for form/file uploads
    "itsdangerous>=2.2",         # signs the API's session cookies
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
sms = ["twilio>=9.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
all = ["drscreen[mysql,postgres,sms,dev]"]

[project.scripts]
drscreen = "drscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:torchvision.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
